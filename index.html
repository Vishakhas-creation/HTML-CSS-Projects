<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="card">
        <div id="search">
            <input type="text" placeholder="Enter city Name" spellcheck="false"></input>
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div id="error">
            <p> City Name Does Not Exist! </p>
        </div>
        <div id="weather">
            <img src="weather.png" alt="image" id="weather-image">
            <h1 id="temp">22°C</h1>
            <h2 id="City">Switzerland</h2>
            <div id="details">
                <div id="col">
                    <img src="humidity.png">
                    <div>
                        <p id="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                 <div id="col">
                    <img src="wind.png">
                    <div>
                        <p id="wind">15km/hr</p>
                        <p>Wind-Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const apiKey ="d433073a2cf8fa1d74b952c2d8879752";
        const apiUrl ="https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchBox = document.querySelector("#search input");
        const searchButton = document.querySelector("#search button");
        const weatherIcon = document.querySelector("#weather-image");

        async function checkWeather(city){
            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

            if(response.status == 404){
                document.querySelector("#error").style.display = "block";
                document.querySelector("#weather").style.display = "none";
            }
            else{
                 var data = await response.json();
            
            document.querySelector("#City").innerHTML = data.name;
            document.querySelector("#temp").innerHTML =Math.round(data.main.temp) + '°C';
            document.querySelector("#humidity").innerHTML = data.main.humidity + "%";
            document.querySelector("#wind").innerHTML = data.wind.speed + "Km/hr";
            
            if(data.weather[0].main == 'Clouds'){
               weatherIcon.src = "./cloud.png";
            }
            else if(data.weather[0].main == 'Clear'){
               weatherIcon.src = "./sun.png";
            }
             else if(data.weather[0].main == 'Rain'){
               weatherIcon.src = "./rainy-day.png";
             }
              else if(data.weather[0].main == 'Drizzle'){
               weatherIcon.src = "./light-rain.png";
             }
              else if(data.weather[0].main == 'Mist'){
               weatherIcon.src = "./cloud(1).png";
             }
             document.querySelector("#weather").style.display = "block";
             document.querySelector("#error").style.display = "none";
        }

            }
        searchButton.addEventListener("click", ()=>{
            checkWeather(searchBox.value);
        })
        
    </script>
</body>
</html>
